[package]
name = "kernel"
description = "The Linux-shaped kernel proper; compiled with forbid(unsafe_code)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
foundation = { path = "../foundation" }
klib = { path = "../klib" }

[features]
# Panic on purpose after the device-tree line, to test the panic path.
test-panic = []
# Hit a breakpoint after PSCI setup, to test the early exception report.
test-fault = ["foundation/test-hooks"]
