[package]
name = "vmlinux"
description = "The final kernel image: links foundation and kernel together"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
foundation = { path = "../foundation" }
kernel = { path = "../kernel" }

[features]
test-panic = ["kernel/test-panic"]
test-fault = ["kernel/test-fault"]
test-nested-fault = ["kernel/test-nested-fault"]
test-unmapped = ["kernel/test-unmapped"]
test-early-lock = ["kernel/test-early-lock"]
test-recursive-panic = ["kernel/test-recursive-panic"]
